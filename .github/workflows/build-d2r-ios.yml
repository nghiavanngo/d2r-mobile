name: Build D2R Mobile iOS & iPadOS IPA

on:
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Build Configuration'
        required: true
        default: 'Release'
        type: choice
        options:
          - Release
          - Debug
      target_os:
        description: 'Target iOS / iPadOS Version'
        required: true
        default: '27.0'
        type: choice
        options:
          - '27.0'
          - '26.0'
          - '18.0'
          - '17.0'
          - '16.0'
          - '15.0'

jobs:
  build-ios:
    name: Build & Package iOS / iPadOS IPA
    # macos-latest tự động lấy macOS mới nhất (tránh lỗi macos-14 retired)
    runs-on: macos-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Verify Xcode Environment
        run: |
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-path

      - name: Install Build Prerequisites
        run: |
          brew install cmake ninja ldid

      - name: Configure CMake for iPadOS / iOS (ARM64 Modern Metal Pipeline)
        run: |
          cmake -B build-ios -G Ninja \
            -DCMAKE_SYSTEM_NAME=iOS \
            -DCMAKE_OSX_SYSROOT=iphoneos \
            -DCMAKE_OSX_ARCHITECTURES=arm64 \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=${{ github.event.inputs.target_os || '27.0' }} \
            -DCMAKE_BUILD_TYPE=${{ github.event.inputs.build_type || 'Release' }} \
            -DPRODUCT_BUNDLE_IDENTIFIER="com.d2rmobile.game" \
            -DPRODUCT_NAME="D2R Mobile" \
            -DD2R_MODERN_PIPELINE=ON

      - name: Compile Native Binary & Assets
        run: |
          cmake --build build-ios --config ${{ github.event.inputs.build_type || 'Release' }} --parallel $(sysctl -n hw.ncpu)

      - name: Package Payload and Info.plist
        run: |
          mkdir -p Payload/"D2R Mobile.app"
          cp -r build-ios/bin/* Payload/"D2R Mobile.app"/ 2>/dev/null || cp -r build-ios/"D2R Mobile.app"/* Payload/"D2R Mobile.app"/
          
          cat << 'EOF' > Payload/"D2R Mobile.app"/Info.plist
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>CFBundleExecutable</key>
              <string>D2R Mobile</string>
              <key>CFBundleIdentifier</key>
              <string>com.d2rmobile.game</string>
              <key>CFBundleName</key>
              <string>D2R Mobile</string>
              <key>CFBundlePackageType</key>
              <string>APPL</string>
              <key>CFBundleShortVersionString</key>
              <string>1.0.0</string>
              <key>LSRequiresIPhoneOS</key>
              <true/>
              <key>MinimumOSVersion</key>
              <string>27.0</string>
              <key>UIFileSharingEnabled</key>
              <true/>
              <key>LSSupportsOpeningDocumentsInPlace</key>
              <true/>
              <key>UISupportedInterfaceOrientations</key>
              <array>
                  <string>UIInterfaceOrientationLandscapeLeft</string>
                  <string>UIInterfaceOrientationLandscapeRight</string>
              </array>
          </dict>
          </plist>
          EOF

      - name: Pseudo-Sign App with ldid
        run: |
          ldid -S Payload/"D2R Mobile.app"/"D2R Mobile" || true

      - name: Create .IPA Archive
        run: |
          zip -r9 d2r-mobile-ios.ipa Payload
          ls -lh d2r-mobile-ios.ipa

      - name: Upload IPA as GitHub Artifact
        uses: actions/upload-artifact@v4
        with:
          name: d2r-mobile-ipados27-${{ github.event.inputs.build_type || 'Release' }}.ipa
          path: d2r-mobile-ios.ipa
          retention-days: 14
