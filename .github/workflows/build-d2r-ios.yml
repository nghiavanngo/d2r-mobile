name: Build D2R Mobile iOS IPA

on:
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Build Configuration'
        required: true
        default: 'Release'
        type: choice
        options:
          - Release
          - Debug
      sign_ipa:
        description: 'Sign with Ad-Hoc / Developer Cert (Requires Secrets)'
        required: false
        default: false
        type: boolean

jobs:
  build-ios:
    name: Build & Package iOS IPA
    runs-on: macos-14 # Apple Silicon M1 runner with Xcode 15/16
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set Up Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode_15.4.app/Contents/Developer
          xcodebuild -version

      - name: Install Build Prerequisites
        run: |
          brew install cmake ninja ldid
          # ldid is used for ad-hoc pseudo-signing on iOS

      - name: Configure CMake for iOS (ARM64)
        run: |
          cmake -B build-ios -G Ninja \
            -DCMAKE_SYSTEM_NAME=iOS \
            -DCMAKE_OSX_SYSROOT=iphoneos \
            -DCMAKE_OSX_ARCHITECTURES=arm64 \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=18.0 \
            -DCMAKE_BUILD_TYPE=${{ github.event.inputs.build_type || 'Release' }} \
            -DPRODUCT_BUNDLE_IDENTIFIER="com.d2rmobile.game" \
            -DPRODUCT_NAME="D2R Mobile"

      - name: Compile Native Binary & Assets
        run: |
          cmake --build build-ios --config ${{ github.event.inputs.build_type || 'Release' }} --parallel $(sysctl -n hw.ncpu)

      - name: Package Payload and Info.plist
        run: |
          mkdir -p Payload/D2R Mobile.app
          cp -r build-ios/bin/* Payload/D2R Mobile.app/ 2>/dev/null || cp -r build-ios/D2R Mobile.app/* Payload/D2R Mobile.app/
          
          # Ensure Info.plist is valid
          cat << 'EOF' > Payload/D2R Mobile.app/Info.plist
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>CFBundleExecutable</key>
              <string>D2R Mobile</string>
              <key>CFBundleIdentifier</key>
              <string>com.d2rmobile.game</string>
              <key>CFBundleName</key>
              <string>D2R Mobile</string>
              <key>CFBundlePackageType</key>
              <string>APPL</string>
              <key>CFBundleShortVersionString</key>
              <string>1.0.0</string>
              <key>LSRequiresIPhoneOS</key>
              <true/>
              <key>MinimumOSVersion</key>
              <string>18.0</string>
              <key>UIFileSharingEnabled</key>
              <true/>
              <key>LSSupportsOpeningDocumentsInPlace</key>
              <true/>
              <key>UISupportedInterfaceOrientations</key>
              <array>
                  <string>UIInterfaceOrientationLandscapeLeft</string>
                  <string>UIInterfaceOrientationLandscapeRight</string>
              </array>
          </dict>
          </plist>
          EOF

      - name: Pseudo-Sign App with ldid (Ad-hoc)
        run: |
          ldid -S Payload/D2R Mobile.app/D2R Mobile || true

      - name: Create .IPA Archive
        run: |
          zip -r9 d2r-mobile-ios.ipa Payload
          ls -lh d2r-mobile-ios.ipa

      - name: Upload IPA as GitHub Artifact
        uses: actions/upload-artifact@v4
        with:
          name: d2r-mobile-ios-${{ github.event.inputs.build_type || 'Release' }}.ipa
          path: d2r-mobile-ios.ipa
          retention-days: 14
